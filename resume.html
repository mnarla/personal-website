<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume — Mayank Narla</title>
  <meta name="description" content="Resume of Mayank Narla. UC Santa Cruz Computer Science. Neurosymbolic AI, Computer Vision, and Systems Engineering.">
  <meta name="theme-color" content="#121316">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&family=Chivo:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* Full-viewport PDF container */
    .resume-page-wrapper {
      padding-top: 84px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .resume-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .resume-meta {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    .resume-meta-code {
      color: var(--accent);
      font-weight: 700;
    }

    .resume-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .resume-viewer-frame {
      flex: 1;
      width: 100%;
      min-height: calc(100vh - 180px);
      background: rgba(24, 25, 31, 0.58);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card-glass);
    }

    .resume-viewer-frame object,
    .resume-viewer-frame iframe {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 180px);
      border: none;
      display: block;
    }

    .resume-fallback {
      padding: 48px 24px;
      text-align: center;
      font-family: var(--font-mono);
      color: var(--text-body);
    }
  </style>
</head>
<body class="telemetry-theme">
  <!-- Custom Kinetic Cursor -->
  <div id="cursor-tracker" class="cursor-tracker" aria-hidden="true">
    <span class="cursor-crosshair">•</span>
    <span class="cursor-label"></span>
  </div>

  <!-- Header HUD -->
  <header id="telemetry-hud" class="telemetry-hud">
    <div class="hud-progress-line" id="scroll-progress-line"></div>
    <div class="hud-container">
      <div class="hud-left">
        <a href="index.html" class="hud-brand" aria-label="Mayank Narla Home">
          <span class="hud-name">MAYANK NARLA</span>
        </a>
        <div class="hud-status-badge">
          <span class="status-dot"></span>
          <span class="status-text">AIEA LAB · SWE @ REC</span>
        </div>
      </div>

      <nav class="hud-nav" aria-label="Main Navigation">
        <a href="index.html" class="hud-link">HOME</a>
        <a href="about.html" class="hud-link">ABOUT</a>
        <a href="projects.html" class="hud-link">PROJECTS</a>
        <a href="resume.html" class="hud-link active">RESUME</a>
        <a href="contact.html" class="hud-link">CONTACT</a>
      </nav>

      <div class="hud-right">
        <a href="https://docs.google.com/document/d/1VMB0v6blI8CmburpSPeXPt6Zx6mSeD_giCl_SmK9u-k/export?format=pdf" class="hud-cta-btn" id="resume-quick-btn">
          DOWNLOAD PDF <span class="btn-arrow">↓</span>
        </a>
      </div>
    </div>
  </header>

  <main id="main-content" class="resume-page-wrapper">
    <div class="container" style="flex: 1; display: flex; flex-direction: column; width: 100%;">
      <!-- Top Action Toolbar -->
      <div class="resume-toolbar">
        <div class="resume-meta">
          <span class="resume-meta-code">DOC //</span> Mayank_Narla_Resume (Google Docs · Live Sync)
        </div>
        <div class="resume-actions">
          <a href="https://docs.google.com/document/d/1VMB0v6blI8CmburpSPeXPt6Zx6mSeD_giCl_SmK9u-k/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm">
            OPEN IN DOCS <span class="btn-arrow">↗</span>
          </a>
          <a href="https://docs.google.com/document/d/1VMB0v6blI8CmburpSPeXPt6Zx6mSeD_giCl_SmK9u-k/export?format=pdf" class="btn btn-primary btn-sm">
            DOWNLOAD PDF <span class="btn-arrow">↓</span>
          </a>
        </div>
      </div>

      <!-- Full-Height Embedded Live Google Doc -->
      <div class="resume-viewer-frame">
        <iframe 
          src="https://docs.google.com/document/d/1VMB0v6blI8CmburpSPeXPt6Zx6mSeD_giCl_SmK9u-k/preview?embedded=true" 
          title="Mayank Narla Resume — Live Google Doc"
          allow="autoplay">
          <div class="resume-fallback">
            <p style="margin-bottom: 20px;">Your browser does not support inline document viewing.</p>
            <a href="https://docs.google.com/document/d/1VMB0v6blI8CmburpSPeXPt6Zx6mSeD_giCl_SmK9u-k/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
              Open Google Doc <span class="btn-arrow">↗</span>
            </a>
          </div>
        </iframe>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="hud-footer">
    <div class="container footer-content">
      <div class="footer-left">
        <span>MAYANK NARLA</span>
      </div>
      <div class="footer-right">
        <span>SANTA CRUZ · PLEASANTON, CA</span>
        <span class="footer-sep">/</span>
        <span>2026</span>
      </div>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
